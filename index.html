<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Harness Atlas: the 12 parts of an AI harness, which ones each role needs, and how to build them up one level at a time.">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Harness Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Layout: one radial "wiring harness" as the hero (model in the centre, 12 parts on a ring, wires light up per role); everything below is tiles, stairs and lanes with as few words as possible. */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --ink:#101217; --muted:#5A6070; --line:#D8DCE3; --soft:#E7EAEF;
  --w-know:#2E62F0; --w-hands:#B67600; --w-rhythm:#0D8A62; --w-brain:#6E45F0; --w-control:#CF3B33;
  --t-know:#E5ECFF; --t-hands:#FBEFD6; --t-rhythm:#DBF3EA; --t-brain:#ECE5FF; --t-control:#FBE3E1;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0E11; --surface:#15181E; --ink:#EDEFF3; --muted:#99A0AD; --line:#2A2F38; --soft:#1E222A;
  --w-know:#7CA2FF; --w-hands:#F0B43C; --w-rhythm:#43CF9C; --w-brain:#A98CFF; --w-control:#FF7B70;
  --t-know:#18223F; --t-hands:#31260E; --t-rhythm:#0E2C22; --t-brain:#231C40; --t-control:#381917;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C0E11; --surface:#15181E; --ink:#EDEFF3; --muted:#99A0AD; --line:#2A2F38; --soft:#1E222A;
  --w-know:#7CA2FF; --w-hands:#F0B43C; --w-rhythm:#43CF9C; --w-brain:#A98CFF; --w-control:#FF7B70;
  --t-know:#18223F; --t-hands:#31260E; --t-rhythm:#0E2C22; --t-brain:#231C40; --t-control:#381917;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);padding-inline:20px;padding-block:0 40px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:clamp(26px,3.6vw,40px)}
p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.eyebrow{font:600 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;font:700 15px/1 var(--f-display)}
.mark{display:flex;gap:3px}
.mark i{width:4px;height:18px;border-radius:2px}
.top nav{display:flex;align-items:center;gap:20px;font-size:14px}
.top nav a{color:var(--muted);text-decoration:none}
.top nav a:hover{color:var(--ink)}
.lang{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 12px/1 var(--f-mono);letter-spacing:.06em;padding:7px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:32px;align-items:center;padding-block:28px 56px}
.hero h1{font-size:clamp(34px,5.4vw,66px)}
.hero h1 .b{display:block;color:var(--muted)}
.lede{font-size:18px;margin-top:18px;color:var(--muted)}
.who{margin-top:30px;display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px/1 var(--f-body);padding:10px 14px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.eq{margin-top:26px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:30px}
.eq .who-is{font:700 15px/1 var(--f-display);margin-right:4px}
.eq .op{font:700 14px/1 var(--f-mono);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;font:700 12px/1 var(--f-mono);letter-spacing:.03em;border:1px solid transparent;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.dim{background:transparent!important;border:1px dashed currentColor;opacity:.7}
.L-know{color:var(--w-know);background:var(--t-know)}
.L-hands{color:var(--w-hands);background:var(--t-hands)}
.L-rhythm{color:var(--w-rhythm);background:var(--t-rhythm)}
.L-brain{color:var(--w-brain);background:var(--t-brain)}
.L-control{color:var(--w-control);background:var(--t-control)}
.info{margin-top:18px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:baseline;font-size:15px;min-height:54px}
.info b{font:700 13px/1.4 var(--f-mono);letter-spacing:.03em;white-space:nowrap}
.info.warn b{color:var(--w-control)}

.rig{position:relative;min-width:0}
.rig svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:16px;height:4px;border-radius:2px}

/* svg parts */
.wire{fill:none;stroke-linecap:round;transition:stroke .3s,stroke-width .3s,opacity .3s}
.wire.off{stroke:var(--line);stroke-width:1.5}
.wire.core{stroke-width:4;stroke-dasharray:1;stroke-dashoffset:0;animation:draw .7s ease-out both}
.wire.extra{stroke-width:2;stroke-dasharray:.02 .025;opacity:.9}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.node{cursor:pointer;outline:none}
.node circle{transition:fill .3s,stroke .3s,stroke-width .3s;fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.node .c{font:700 17px var(--f-mono);fill:var(--muted);transition:fill .3s}
.node .n{font:500 11.5px var(--f-body);fill:var(--muted)}
.node.core circle{stroke-width:3}
.node.extra circle{stroke-width:2;stroke-dasharray:5 4}
.node.off{opacity:.55}
.node:hover circle,.node:focus-visible circle{stroke-width:3.5}
.node.picked circle{stroke-width:4}
.core-ring{fill:none;stroke:var(--line);stroke-dasharray:3 6}
.core-dot{fill:var(--ink)}
.core-t{font:700 15px var(--f-display);fill:var(--bg);letter-spacing:.06em}
.sheath{fill:none;stroke-width:4;stroke-linecap:round}

section{padding-block:64px;border-top:1px solid var(--line)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px 24px;margin-bottom:28px}

/* pains */
.pains{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pain{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;display:grid;min-height:170px;perspective:800px}
.pain:hover{border-color:var(--ink)}
.face{grid-area:1/1;display:grid;gap:12px;align-content:space-between;transition:opacity .25s,transform .35s;backface-visibility:hidden}
.face .q{font:600 18px/1.25 var(--f-body);letter-spacing:-.01em}
.face .q::before{content:"“";font-family:var(--f-display);color:var(--muted);margin-right:2px}
.face .q::after{content:"”";font-family:var(--f-display);color:var(--muted)}
.face .fix{font-size:15.5px;line-height:1.4}
.face .tags{display:flex;flex-wrap:wrap;gap:5px}
.back{opacity:0;transform:rotateX(-90deg)}
.pain.flip .front{opacity:0;transform:rotateX(90deg)}
.pain.flip .back{opacity:1;transform:none}
.pain.flip{background:var(--soft)}
.flipmark{font:700 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* stairs */
.stairs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end}
.stair{display:grid;gap:10px;align-content:end}
.stair h3{font-size:17px}
.stair p{font-size:14px;color:var(--muted);min-height:2.6em}
.bar{height:var(--h);border-radius:6px 6px 2px 2px;background:color-mix(in srgb,var(--ink) var(--a),var(--soft));display:flex;align-items:flex-end;padding:12px 14px;transition:height .5s}
.bar span{font:700 34px/1 var(--f-display);color:var(--bg)}
.stair:first-child .bar span{color:var(--muted)}
.stair .tags{display:flex;flex-wrap:wrap;gap:5px;min-height:26px}

/* case */
.lanes{display:grid;gap:12px}
.lane{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 18px}
.lane h3{font-size:16px}
.track{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.st{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;font:500 14px/1.2 var(--f-body);background:var(--tint);color:var(--ink);border:1px solid color-mix(in srgb,var(--wire) 40%,transparent)}
.st b{font:700 11px/1 var(--f-mono);color:var(--wire);letter-spacing:.04em}
.arrow{color:var(--muted);font:700 14px/1 var(--f-mono)}
details{margin-top:12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r)}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;font:700 15px/1.2 var(--f-display)}
summary::-webkit-details-marker{display:none}
summary .plus{font:700 18px/1 var(--f-mono);color:var(--muted);transition:transform .2s}
details[open] summary .plus{transform:rotate(45deg)}
.dbody{padding:0 18px 18px;display:grid;gap:12px}
pre{margin:0;background:var(--soft);border-radius:6px;padding:16px;overflow:auto;font:600 12.5px/1.65 var(--f-mono);white-space:pre-wrap;word-break:break-word}
.btn{appearance:none;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:600 13px/1 var(--f-body);padding:9px 14px;border-radius:6px;cursor:pointer;justify-self:start}

footer{border-top:1px solid var(--line);padding-block:24px 0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
footer a{color:inherit}

@media (max-width:960px){
  .hero{grid-template-columns:1fr;gap:12px;padding-block:16px 40px}
  .rig{order:-1;max-width:560px;margin:0 auto;width:100%}
  .pains{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lane{grid-template-columns:1fr;gap:10px}
}
@media (max-width:640px){
  body{padding-inline:16px}
  .top nav a{display:none}
  .node .n{display:none}
  .node .c{font-size:22px}
  .pains{grid-template-columns:1fr}
  .pain{min-height:130px}
  .stairs{grid-template-columns:1fr;gap:8px}
  .stair{grid-template-columns:64px minmax(0,1fr);grid-template-areas:"bar h" "bar p" "bar t";column-gap:14px;row-gap:4px;align-items:center}
  .stair .bar{grid-area:bar;height:auto;min-height:72px;justify-content:center;align-items:center}
  .stair h3{grid-area:h}.stair p{grid-area:p;min-height:0}.stair .tags{grid-area:t;min-height:0}
  .arrow{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><i style="background:var(--w-know)"></i><i style="background:var(--w-hands)"></i><i style="background:var(--w-rhythm)"></i><i style="background:var(--w-brain)"></i><i style="background:var(--w-control)"></i></span>Harness Atlas</div>
    <nav>
      <a href="#pains" data-t="navPains"></a>
      <a href="#levels" data-t="navLevels"></a>
      <a href="#case" data-t="navCase"></a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-en" aria-pressed="true">EN</button>
        <button type="button" id="lang-ru" aria-pressed="false">RU</button>
      </div>
    </nav>
  </header>

  <div class="hero" id="builder">
    <div>
      <h1><span data-t="h1a"></span> <span class="b" data-t="h1b"></span></h1>
      <p class="lede" data-t="lede"></p>
      <div class="who">
        <span class="eyebrow" data-t="iam"></span>
        <div class="chips" id="chips"></div>
      </div>
      <div class="eq" id="eq" aria-live="polite"></div>
      <div class="info" id="info" aria-live="polite"></div>
    </div>
    <div class="rig">
      <svg id="rig" viewBox="-308 -308 616 616" role="img" aria-labelledby="rigTitle"><title id="rigTitle">Harness diagram</title></svg>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <section id="pains">
    <div class="head"><h2 data-t="painsT"></h2><span class="eyebrow" data-t="painsS"></span></div>
    <div class="pains" id="painGrid"></div>
  </section>

  <section id="levels">
    <div class="head"><h2 data-t="lvT"></h2></div>
    <div class="stairs" id="stairs"></div>
  </section>

  <section id="case">
    <div class="head"><div><p class="eyebrow" data-t="caseEy"></p><h2 style="margin-top:12px" id="caseTitle"></h2></div></div>
    <div class="chips" id="caseChips" style="margin-bottom:20px"></div>
    <div class="lanes" id="lanes"></div>
    <details id="prof">
      <summary><span data-t="profileT"></span><span class="plus" aria-hidden="true">+</span></summary>
      <div class="dbody">
        <pre id="profile"></pre>
        <button class="btn" id="copyBtn" type="button" data-t="copy"></button>
      </div>
    </details>
  </section>

  <footer>
    <span data-t="foot"></span>
  </footer>
</div>

<script>
/* ---------- DATA (edit here) ---------- */
const LAYERS = {know:{en:"Knowledge",ru:"Знание"}, hands:{en:"Hands",ru:"Руки"}, rhythm:{en:"Rhythm",ru:"Ритм"}, brain:{en:"Brain",ru:"Мозг"}, control:{en:"Control",ru:"Контроль"}};

const BLOCKS = [
  {id:"CTX",  layer:"know",   en:["Instructions","Rules it reads every session"],        ru:["Инструкции","Правила, которые он читает каждый раз"]},
  {id:"MEM",  layer:"know",   en:["Memory","Survives closing the chat"],                  ru:["Память","Переживает закрытие чата"]},
  {id:"KB",   layer:"know",   en:["Knowledge","Your documents, with citations"],          ru:["База знаний","Твои документы, со ссылками"]},
  {id:"TOOL", layer:"hands",  en:["Connectors","Mail, calendar, sheets, GitHub"],         ru:["Коннекторы","Почта, календарь, таблицы, GitHub"]},
  {id:"ACT",  layer:"hands",  en:["Actions","Browser, terminal, desktop"],                ru:["Действия","Браузер, терминал, рабочий стол"]},
  {id:"SKILL",layer:"hands",  en:["Skills","A procedure done the same way every time"],   ru:["Навыки","Процедура, каждый раз одинаково"]},
  {id:"AUTO", layer:"rhythm", en:["Schedule","Runs while you are away"],                  ru:["Расписание","Работает, пока тебя нет"]},
  {id:"CHAN", layer:"rhythm", en:["Channels","Chat, IDE, Telegram, phone"],               ru:["Каналы","Чат, IDE, Telegram, телефон"]},
  {id:"ROUTE",layer:"brain",  en:["Routing","Right model per task, backup on limits"],    ru:["Роутинг","Нужная модель на задачу, запасная при лимитах"]},
  {id:"MULTI",layer:"brain",  en:["Sub-agents","Parallel workers and reviewers"],         ru:["Субагенты","Параллельные исполнители и ревьюеры"]},
  {id:"GUARD",layer:"control",en:["Guardrails","Permissions, isolation, logs, costs"],    ru:["Ограничения","Права, изоляция, журнал, расходы"]},
  {id:"EVAL", layer:"control",en:["Verification","Proof that it is actually done"],       ru:["Проверка","Доказательство, что готово"]}
];

const ROLES = [
  {id:"dev",     en:"developer",     ru:"разработчик",    core:["CTX","ACT","SKILL","GUARD","EVAL"], extra:["MEM","MULTI","ROUTE","AUTO"], pit:{en:"“Done” without running the tests.",ru:"«Готово» без запуска тестов."}},
  {id:"game",    en:"game dev",      ru:"геймдев",        core:["CTX","ACT","KB","GUARD","EVAL"],    extra:["AUTO","MULTI","ROUTE"],       pit:{en:"An engine dialog freezes the agent until timeout.",ru:"Диалог движка вешает агента до таймаута."}},
  {id:"design",  en:"designer",      ru:"дизайнер",       core:["KB","TOOL","SKILL","EVAL"],         extra:["ACT","MEM","AUTO"],           pit:{en:"No brand guide in context, generic output.",ru:"Без гайда в контексте получается «средний интернет»."}},
  {id:"data",    en:"data scientist",ru:"дата-сайентист", core:["TOOL","ACT","KB","GUARD","EVAL"],   extra:["SKILL","AUTO","MULTI"],       pit:{en:"Numbers come from the model, not from code.",ru:"Цифры «в уме», а не из кода."}},
  {id:"hr",      en:"recruiter",     ru:"рекрутер",       core:["CTX","TOOL","SKILL","GUARD","EVAL"],extra:["MEM","AUTO","CHAN"],          pit:{en:"Personal data and bias. A human decides.",ru:"Персональные данные и предвзятость. Решает человек."}},
  {id:"mkt",     en:"marketer",      ru:"маркетолог",     core:["KB","SKILL","TOOL","EVAL","GUARD"], extra:["AUTO","ACT","MULTI"],         pit:{en:"Auto-publishing without a review.",ru:"Автопубликация без проверки."}},
  {id:"founder", en:"founder",       ru:"основатель",     core:["CHAN","MEM","TOOL","GUARD","ROUTE"],extra:["AUTO","MULTI","SKILL","CTX"], pit:{en:"Projects leak into each other's chats.",ru:"Проекты пишут в чужие чаты."}},
  {id:"econ",    en:"economist",     ru:"экономист",      core:["CTX","KB","MEM","SKILL","TOOL","EVAL"], extra:["AUTO","ACT","GUARD"],     pit:{en:"Invented experience on the CV.",ru:"Выдуманный опыт в CV."}},
  {id:"student", en:"student",       ru:"студент",        core:["KB","MEM","SKILL","EVAL"],          extra:["AUTO","CTX"],                 pit:{en:"Reading summaries instead of being quizzed.",ru:"Читать пересказы вместо того, чтобы проверять себя."}}
];

const PAINS = [
  {b:["CTX","MEM"],         en:["I re-explain everything every time","Stable facts go to instructions. Changing ones go to memory."], ru:["Каждый раз объясняю заново","Постоянное в инструкции, меняющееся в память."]},
  {b:["KB"],                en:["Too many documents for one chat","A searchable knowledge base. No citation means it is a guess."], ru:["Документов больше, чем влезает в чат","База знаний с поиском. Без цитаты это догадка."]},
  {b:["ROUTE","MEM"],       en:["I keep hitting model limits","Light model for easy turns, a backup provider, state kept in files."], ru:["Упираюсь в лимиты","Лёгкая модель на простое, запасной провайдер, состояние в файлах."]},
  {b:["SKILL","AUTO"],      en:["Same task every week","Write it down as a skill once. Then put it on a schedule."], ru:["Каждую неделю одно и то же","Запиши навык один раз. Потом поставь на расписание."]},
  {b:["AUTO","CHAN","GUARD"],en:["It should work without me","A schedule, a channel for reports, rules for what needs your yes."], ru:["Пусть работает без меня","Расписание, канал для отчётов, правила, что требует твоего «да»."]},
  {b:["GUARD","CTX","CHAN"],en:["My projects get mixed up","One agent, folder and channel per project, enforced in code."], ru:["Проекты смешиваются","Свой агент, папка и канал на проект. Запрет в коде, а не в промпте."]},
  {b:["EVAL"],              en:["It says done. It isn't.","A check that can fail: a test, a build, a screenshot, a source."], ru:["Говорит «готово». Не готово.","Проверка, которая может упасть: тест, сборка, скриншот, источник."]},
  {b:["ACT","GUARD"],       en:["It has to work on websites","The agent searches and drafts. You submit and pay."], ru:["Нужно действовать на сайтах","Агент ищет и готовит черновик. Отправляешь и платишь ты."]},

/* ---------- STATE ---------- */
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let lang = location.hash === "#ru" ? "ru" : location.hash === "#en" ? "en" : (store.get("ha2-lang") || "en");
let role = store.get("ha2-role") || "dev";
if (!ROLES.some(r => r.id === role)) role = "dev";
let picked = null;
const flipped = new Set();

const $ = s => document.querySelector(s);
const t = k => T[k][lang];
const byId = Object.fromEntries(BLOCKS.map(b => [b.id, b]));
const tag = (id, dim) => `<span class="tag L-${byId[id].layer}${dim ? " dim" : ""}">${id}</span>`;
const R = () => ROLES.find(r => r.id === role);

/* ---------- RIG GEOMETRY ---------- */
const NS = "http://www.w3.org/2000/svg";
const RING = 240, NODE = 42, CORE = 70;
const order = Object.keys(LAYERS).flatMap(l => BLOCKS.filter(b => b.layer === l));
const GAP = 0.7, units = order.length + Object.keys(LAYERS).length * GAP, step = 360 / units;
const pos = {}, arcs = {};
let cur = -90 - step / 2;
for (const l of Object.keys(LAYERS)) {
  cur += GAP * step / 2;
  const start = cur;
  for (const b of order.filter(x => x.layer === l)) { cur += step / 2; pos[b.id] = cur; cur += step / 2; }
  arcs[l] = [start + 4, cur - 4];
  cur += GAP * step / 2;
}
const P = (deg, r) => { const a = deg * Math.PI / 180; return [r * Math.cos(a), r * Math.sin(a)]; };
const arcPath = (a0, a1, r) => { const [x0,y0] = P(a0,r), [x1,y1] = P(a1,r); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };

function buildRig(){
  const svg = $("#rig");
  let h = "";
  for (const [l,[a0,a1]] of Object.entries(arcs)) h += `<path class="sheath" d="${arcPath(a0,a1,RING + NODE + 14)}" style="stroke:var(--w-${l})"/>`;
  for (const b of order) {
    const a = pos[b.id];
    const [sx,sy] = P(a, CORE + 4), [cx,cy] = P(a + 16, 150), [ex,ey] = P(a, RING - NODE - 3);
    h += `<path class="wire off" id="w-${b.id}" pathLength="1" d="M${sx.toFixed(1)} ${sy.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}"/>`;
  }
  h += `<circle class="core-ring" r="${CORE + 18}"/><circle class="core-dot" r="${CORE}"/><text class="core-t" id="coreT" text-anchor="middle" dominant-baseline="central"></text>`;
  for (const b of order) {
    const [x,y] = P(pos[b.id], RING);
    h += `<g class="node off" id="n-${b.id}" data-b="${b.id}" tabindex="0" role="button" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" style="--wire:var(--w-${b.layer});--tint:var(--t-${b.layer})">
      <circle r="${NODE}"/><text class="c" text-anchor="middle" y="-2">${b.id}</text><text class="n" text-anchor="middle" y="17"></text></g>`;
  }
  svg.insertAdjacentHTML("beforeend", h);
  svg.addEventListener("click", e => { const g = e.target.closest(".node"); if (g) pick(g.dataset.b); });
  svg.addEventListener("keydown", e => { const g = e.target.closest(".node"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(g.dataset.b); } });
}
function pick(id){ picked = picked === id ? null : id; paintRig(false); renderInfo(); }

function paintRig(animate){
  const r = R();
  for (const b of order) {
    const st = r.core.includes(b.id) ? "core" : r.extra.includes(b.id) ? "extra" : "off";
    const w = document.getElementById("w-" + b.id), n = document.getElementById("n-" + b.id);
    w.setAttribute("class", "wire " + st);
    w.style.stroke = st === "off" ? "" : `var(--w-${b.layer})`;
    if (animate && st === "core") { w.style.animation = "none"; w.getBoundingClientRect(); w.style.animation = ""; }
    n.setAttribute("class", `node ${st}${picked === b.id ? " picked" : ""}`);
    const c = n.querySelector("circle"), tc = n.querySelector(".c");
    c.style.fill = st === "core" ? `var(--t-${b.layer})` : "";
    c.style.stroke = st === "off" ? "" : `var(--w-${b.layer})`;
    tc.style.fill = st === "off" ? "" : `var(--w-${b.layer})`;
  }
}

/* ---------- RENDER ---------- */
function renderText(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $("#lang-en").setAttribute("aria-pressed", lang === "en");
  $("#lang-ru").setAttribute("aria-pressed", lang === "ru");
  $("#coreT").textContent = t("model");
  for (const b of order) document.querySelector(`#n-${b.id} .n`).textContent = b[lang][0];
  $("#legend").innerHTML = Object.entries(LAYERS).map(([k,l]) => `<span><i style="background:var(--w-${k})"></i>${l[lang]}</span>`).join("");
}
function renderChips(){
  $("#chips").innerHTML = ROLES.map(r => `<button type="button" class="chip" data-r="${r.id}" aria-pressed="${r.id === role}">${r[lang]}</button>`).join("");
}
function renderEq(){
  const r = R();
  $("#eq").innerHTML = `<span class="who-is">${r[lang]}</span><span class="op">=</span>`
    + r.core.map(id => tag(id)).join('<span class="op">+</span>')
    + (r.extra.length ? '<span class="op">+</span>' + r.extra.map(id => tag(id, true)).join("") : "");
}
function renderInfo(){
  const el = $("#info");
  if (picked) { const b = byId[picked]; el.className = "info"; el.innerHTML = `<b style="color:var(--w-${b.layer})">${b.id} · ${b[lang][0]}</b><span>${b[lang][1]}</span>`; }
  else { el.className = "info warn"; el.innerHTML = `<b>${t("watch")}</b><span>${R().pit[lang]}</span>`; }
}
function renderPains(){
  $("#painGrid").innerHTML = PAINS.map((p,i) => `<button type="button" class="pain${flipped.has(i) ? " flip" : ""}" data-i="${i}" aria-pressed="${flipped.has(i)}">
    <div class="face front"><p class="q">${p[lang][0]}</p><div class="tags">${p.b.map(id => tag(id)).join("")}</div></div>
    <div class="face back"><span class="flipmark">${t("fix")}</span><p class="fix">${p[lang][1]}</p><div class="tags">${p.b.map(id => tag(id)).join("")}</div></div></button>`).join("");
}
function renderStairs(){
  $("#stairs").innerHTML = LEVELS.map((l,i) => `<div class="stair"><h3>${l[lang][0]}</h3><p>${l[lang][1]}</p>
    <div class="bar" style="--h:${l.h}px;--a:${l.a}"><span>${i}</span></div>
    <div class="tags">${l.b.map(id => tag(id)).join("")}</div></div>`).join("");
}
function renderCase(){
  const c = CASES[role], r = R(), name = r[lang].charAt(0).toUpperCase() + r[lang].slice(1);
  $("#caseTitle").textContent = name + ": " + c.title[lang];
  $("#caseChips").innerHTML = ROLES.map(x => `<button type="button" class="chip" data-r="${x.id}" aria-pressed="${x.id === role}">${x[lang]}</button>`).join("");
  $("#profile").textContent = c.starter[lang];
  $("#lanes").innerHTML = c.lanes.map(l => `<div class="lane"><h3>${l[lang]}</h3><div class="track">${l.steps.map(([id,en,ru]) => {
    const b = byId[id];
    return `<span class="st" style="--wire:var(--w-${b.layer});--tint:var(--t-${b.layer})"><b>${id}</b>${lang === "en" ? en : ru}</span>`;
  }).join('<span class="arrow" aria-hidden="true">→</span>')}</div></div>`).join("");
}
function renderAll(){ renderText(); renderChips(); renderEq(); renderInfo(); renderPains(); renderStairs(); renderCase(); paintRig(false); }

/* ---------- EVENTS ---------- */
buildRig();
renderAll();
paintRig(true);

function setRole(e){
  const c = e.target.closest(".chip"); if (!c) return;
  role = c.dataset.r; picked = null; store.set("ha2-role", role);
  renderChips(); renderEq(); renderInfo(); renderCase(); paintRig(true);
}
$("#chips").addEventListener("click", setRole);
$("#caseChips").addEventListener("click", setRole);
function setLang(l){ if (l === lang) return; lang = l; store.set("ha2-lang", l); renderAll(); }
$("#lang-en").addEventListener("click", () => setLang("en"));
$("#lang-ru").addEventListener("click", () => setLang("ru"));
$("#painGrid").addEventListener("click", e => {
  const c = e.target.closest(".pain"); if (!c) return;
  const i = +c.dataset.i; flipped.has(i) ? flipped.delete(i) : flipped.add(i);
  c.classList.toggle("flip"); c.setAttribute("aria-pressed", flipped.has(i));
});
$("#copyBtn").addEventListener("click", async () => {
  const btn = $("#copyBtn");
  try { await navigator.clipboard.writeText(CASES[role].starter[lang]); btn.textContent = t("copied"); }
  catch { const r = document.createRange(); r.selectNodeContents($("#profile")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = t("selected"); }
  setTimeout(() => btn.textContent = t("copy"), 1800);
});
</script>

</body>
</html>
